name: fhau-browser-aarch64
description: |

  A fork of https://github.com/balena-io-experimental/browser
  developed with the aim of customizing the upstream block 
  definition provided by the balena-io-experimental maintainers
  to modernize it, and to add support for features required 
  by the author for a a work in progress Balena application 
  which controls a hardware device over USB.

  The base version of the upstream 'browser' block project is 
  the commit 1bf74ad, which matches tag 2.10.0 and also HEAD of 
  the master branch as it stood on 15 July 2025.
  
  Customizations relative to the upstream project are expected
  to include:
    - merging upstream pull request #185 authored by @alanb128
      to rebase the block on generic Docker base images rather 
      than the deprecated balenalibs images;
    - adding support for running on Raspberry Pi Zero 2 W 
      (upstream pull request #186 has been submitted by the author 
      on this topic);
    - any other changes which may be required to ensure that the 
      target application is able to run the following two containers:
        - one based on this block which which hosts an Xorg server 
          and a kiosk-mode browser;
        - a second one unique to the target application which 
          will host a USB-enabled hardware control application
          in a CGI-like integration with a web server serving
          the device control UI to the kiosk browser in the
          other container.

  The author plans to make this block public, but does not commit to 
  maintain it over time.  Customizations implemented here will be 
  considered for feeding back to the balena-io-experimental 
  maintainers, and this block will be deprecated in the event that 
  the upstream implementation satisfies all requirements of the 
  author's target application.

  Author: 
  Tim Littlefair 
  https://www.linkedin.com/in/tim-littlefair/
  https://heretical-camelid.net

# Additional information about the target application:
# The target application referred to above is being developed at
# https://github.com/tim-littlefair/feral-horse-amp-utils
# and is intended to provide a web-based control UI for 
# Fender Mustang LT-series modelling guitar amplifiers.
# Models supported initially will be limited to those which 
# can be controlled using the 'Fender Tone LT Desktop' software 
# for Windows and macOS.  Depending on community interest 
# in the project, support may be added at a later date for 
# Mustang GT-, GTX- and Mustang Micro Plus devices which are 
# controlled over Bluetooth transports from phone/tablet 
# applications under the 'Fender Tone' branding.

# Community members interested in this block or in the target
# application are encouraged to contact the author via the 
# LinkedIn URL in the description above.

# Not sure what post-provisioning does so it is x- prefixed for 
# now in the hope that this will stop it running.
x-post-provisioning: >-
  [![balena](https://github.com/balena-labs-projects/browser/actions/workflows/balena.yml/badge.svg)](https://github.com/balena-labs-projects/browser/actions/workflows/balena.yml)

  ## Usage instructions

  Include this snippet in your docker-compose.yml file under 'services':
    
    ```
    browser:
      image: bh.cr/balenalabs/browser-<arch> # where <arch> is one of aarch64, arm32 or amd64
      privileged: true # required for UDEV to find plugged in peripherals such as a USB mouse
      network_mode: host
      volumes:
        - 'settings:/data' # Only required if using PERSISTENT flag (see below)
    ```

    To pin to a specific [version](CHANGELOG.md) of this block use:

    ```
      browser:
        image: bh.cr/balenalabs/browser-<arch>/<version>
        privileged: true # required for UDEV to find plugged in peripherals such as a USB mouse
        network_mode: host
        ports:
            - '5011' # management API (optional)
            - '35173' # Chromium debugging port (optional)
        volumes:
          - 'settings:/data' # Only required if using PERSISTENT flag (see below)
    ```

# Version is intended to be syntactically semver-compliant
# Upstream version number has been preserved,
# "pre-release"-suffix is mildly out of spec semantically 
# because my fork is being developed after upstream's 2.10.0, 
# but its not my business to decide what upstream's next version 
# number will be or to assume that my work will be merged into it.
version: 2.10.0-1bf73ad.tl2507a
type: sw.block
assets:
  repository:
    type: blob.asset
    data:
      url: 'https://github.com/tim-littlefair/tl-balena-browser'
  logo:
    type: blob.asset
    data:
      url: 'https://heretical-camelid.net/_static/heretical-camelid-noattr.svg'
data:
  defaultDeviceType: raspberrypi3-64
  # supportedDeviceTypes has been reduced to only
  # include 64-bit OSs on hardware available to author
  # for testing.  Community members able to test on 
  # other hardware are welcome to contact the author
  # or send pull requests confirming success with 
  # those devices.
  supportedDeviceTypes:
    # - raspberrypi4-64
    # - fincm3
    # - raspberrypi3
    - raspberrypi3-64
    # - raspberrypi400-64
    # - raspberrypi5
    # - intel-nuc
    # - genericx86-64-ext
    - raspberrypi0-2w-64
